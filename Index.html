<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATHLUME</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <input type="checkbox" id="start-game" class="screen-toggle">
  <input type="radio" name="difficulty" id="easy" class="difficulty-toggle">
  <input type="radio" name="difficulty" id="medium" class="difficulty-toggle" checked>
  <input type="radio" name="difficulty" id="hard" class="difficulty-toggle">

  <main class="app">
    <section class="menu-screen">
      <div class="title-block">
        <div class="meteor-emoji">☄️</div>
        <h1>MATHLUME</h1>
        <p>Destrua os meteoros com matemática!</p>
      </div>

      <div class="difficulty-section">
        <span class="section-label">Escolha a Dificuldade</span>
        <div class="difficulty-list">
          <label for="easy" class="difficulty-card easy-card">
            <span class="difficulty-emoji">🌱</span>
            <span class="difficulty-name">Fácil</span>
            <span class="difficulty-desc">Soma e subtração<br>Meteoros lentos</span>
          </label>
          <label for="medium" class="difficulty-card medium-card">
            <span class="difficulty-emoji">🔥</span>
            <span class="difficulty-name">Médio</span>
            <span class="difficulty-desc">Todas as operações<br>Velocidade normal</span>
          </label>
          <label for="hard" class="difficulty-card hard-card">
            <span class="difficulty-emoji">💀</span>
            <span class="difficulty-name">Difícil</span>
            <span class="difficulty-desc">Contas difíceis<br>Meteoros rápidos</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <label for="start-game" class="start-button"><span>🚀</span><span>Iniciar</span></label>
        <button type="button" class="exit-button"><span>🚪</span><span>Sair</span></button>
      </div>
    </section>

    <section class="game-screen">
      <div class="stars" aria-hidden="true"></div>

      <div class="hud">
        <div class="hud-block">
          <span class="hud-label">Pontos</span>
          <span class="score">0</span>
        </div>

        <div class="level-block">
          <div class="level-title">
            <span class="hud-label">Nível</span>
            <span class="level">1</span>
            <span class="difficulty-emoji-small">🔥</span>
          </div>
          <div class="progress-bar"><div class="progress"></div></div>
          <span class="progress-label">0/5 para próximo nível</span>
        </div>

        <div class="hud-block lives-block">
          <span class="hud-label">Vidas</span>
          <div class="lives">❤️ ❤️ ❤️</div>
        </div>
      </div>

      <div class="meteor meteor-one">
        <div class="trail"></div>
        <div class="meteor-body"><span>= ?</span></div>
        <div class="meteor-fire"></div>
      </div>

      <div class="meteor meteor-two">
        <div class="trail"></div>
        <div class="meteor-body"><span>= ?</span></div>
        <div class="meteor-fire"></div>
      </div>

      <div class="answer-area">
        <div class="answer-box">
          <input type="number" placeholder="Digite a resposta..." autocomplete="off">
        </div>
        <button type="button" class="submit-button">🚀</button>
      </div>

      <div class="answer-help">Digite a resposta e pressione Enter ou 🚀</div>
    </section>
  </main>
</body>
</html>
