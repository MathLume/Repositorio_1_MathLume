name: Verificar Assignee, Branch e Datas (In Progress)

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  issues: write
  contents: read

jobs:
  check-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar issues em "In Progress"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const ORG = context.repo.owner;
            const PROJECT_NUMBER = 1;
            const STATUS_ALVO = 'In Progress';
            const START_FIELD = 'Start date';
            const TARGET_FIELD = 'Target date';
            const LABEL = 'aguardando-assignee-branch';
            const MARKER = '<!-- check-assignee-branch-bot -->';

            // Garante que a label existe (e atualiza a descricao)
            const labelInfo = {
              owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
              color: 'D93F0B',
              description: 'Faltando assignee, branch vinculada, Start date e/ou Target date'
            };
            try {
              await github.rest.issues.getLabel({ owner: labelInfo.owner, repo: labelInfo.repo, name: LABEL });
              await github.rest.issues.updateLabel(labelInfo).catch(() => {});
            } catch (e) {
              await github.rest.issues.createLabel(labelInfo);
            }

            // Busca itens do Project. As datas podem estar no Project ou como campo da propria issue
            const query = `
              query($org: String!, $number: Int!, $cursor: String, $start: String!, $target: String!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        inicio: fieldValueByName(name: $start) {
                          ... on ProjectV2ItemFieldDateValue { date }
                        }
                        prazo: fieldValueByName(name: $target) {
                          ... on ProjectV2ItemFieldDateValue { date }
                        }
                        content {
                          ... on Issue {
                            id number url state
                            repository { name owner { login } }
                            assignees(first: 20) { totalCount nodes { login } }
                            linkedBranches(first: 5) { totalCount }
                            labels(first: 30) { nodes { name } }
                            issueFieldValues(first: 20) {
                              nodes {
                                ... on IssueFieldDateValue {
                                  value
                                  field { ... on IssueFieldDate { name } }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            let cursor = null, items = [];
            while (true) {
              const res = await github.graphql(query, {
                org: ORG, number: PROJECT_NUMBER, cursor,
                start: START_FIELD, target: TARGET_FIELD,
                // Necessario para ler os campos da issue (Start date, Target date)
                headers: { 'GraphQL-Features': 'issue_fields' }
              });
              const conn = res.organization.projectV2.items;
              items = items.concat(conn.nodes);
              if (!conn.pageInfo.hasNextPage) break;
              cursor = conn.pageInfo.endCursor;
            }

            // Le a data do campo do Project; se vazio, usa o campo da propria issue
            const lerData = (valorProject, issue, nomeCampo) => {
              if (valorProject?.date) return valorProject.date;
              for (const v of issue.issueFieldValues?.nodes || []) {
                if ((v?.field?.name || '').toLowerCase() === nomeCampo.toLowerCase() && v.value) {
                  return v.value.slice(0, 10);
                }
              }
              return null;
            };
            const br = d => d.split('-').reverse().join('/');

            for (const item of items) {
              const status = item.fieldValueByName?.name;
              const issue = item.content;
              if (status !== STATUS_ALVO || !issue || !issue.number || issue.state !== 'OPEN') continue;

              const owner = issue.repository.owner.login;
              const repo = issue.repository.name;
              const issue_number = issue.number;
              const startDate = lerData(item.inicio, issue, START_FIELD);
              const targetDate = lerData(item.prazo, issue, TARGET_FIELD);

              const checks = [
                { ok: issue.assignees.totalCount > 0, texto: '**Assignee** (responsável pela issue)' },
                { ok: issue.linkedBranches.totalCount > 0, texto: '**Branch vinculada** (seção "Development" da issue)' },
                { ok: !!startDate, texto: `**${START_FIELD}** (data de início)` },
                { ok: !!targetDate, texto: `**${TARGET_FIELD}** (data prevista de entrega)` },
              ];
              if (startDate && targetDate && startDate > targetDate) {
                checks.push({ ok: false, texto: `**Datas coerentes**: o ${START_FIELD} (${br(startDate)}) está depois do ${TARGET_FIELD} (${br(targetDate)})` });
              }
              const pendente = checks.some(c => !c.ok);
              const hasLabel = issue.labels.nodes.some(l => l.name === LABEL);

              // Tudo certo: remove a label e marca o aviso anterior como resolvido
              if (!pendente) {
                if (hasLabel) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL }).catch(() => {});
                  const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                  const aviso = comentarios.filter(c => (c.body || '').includes(MARKER)).pop();
                  if (aviso) {
                    await github.rest.issues.updateComment({
                      owner, repo, comment_id: aviso.id,
                      body: `${MARKER}\n✅ Pendências resolvidas: esta issue já tem assignee, branch vinculada, ${START_FIELD} e ${TARGET_FIELD}. Obrigado!`
                    });
                  }
                  console.log(`#${issue_number}: tudo ok, label removida`);
                }
                continue;
              }

              const mencoes = issue.assignees.nodes.map(a => `@${a.login}`).join(' ');
              const lista = checks.map(c => `- [${c.ok ? 'x' : ' '}] ${c.texto}`).join('\n');
              const body =
                `${MARKER}\n` +
                `⚠️ ${mencoes ? mencoes + ', esta' : 'Esta'} issue está em **${STATUS_ALVO}**, mas ainda tem pendências:\n\n` +
                `${lista}\n\n` +
                `Atribua um responsável, vincule uma branch e preencha os campos **${START_FIELD}** e **${TARGET_FIELD}** ` +
                `(na barra lateral da issue ou no Project). Este aviso é atualizado automaticamente.`;

              if (hasLabel) {
                // Ja avisado: so atualiza o comentario existente se as pendencias mudaram (evita spam)
                const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                const aviso = comentarios.filter(c => (c.body || '').includes(MARKER)).pop();
                if (aviso && aviso.body !== body) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: aviso.id, body });
                  console.log(`#${issue_number}: aviso atualizado`);
                } else if (!aviso) {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body });
                }
                continue;
              }

              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              console.log(`#${issue_number}: novo aviso publicado`);
            }
