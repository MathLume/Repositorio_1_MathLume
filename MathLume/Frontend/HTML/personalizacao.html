<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personalização — MathLume</title>
  <link rel="stylesheet" href="../CSS/personalizacao.css">
  <link rel="stylesheet" href="../CSS/cabecalho.css">
</head>
<body data-tema="espaco">
  <audio id="botoes" src="../assets/efeitos_sonoros/botao.mp3"></audio>
  <div class="fundo" aria-hidden="true"></div>

  <!-- cabeçalho igual em todas as telas: JS/cabecalho.js + CSS/cabecalho.css -->
  <nav class="navbar" id="cabecalho" data-pagina="personalizacao">
    <a data-manter href="loja.html#moedas" class="saldo" id="saldoLink" title="Comprar Lumes">🪙 <b id="saldo">0</b> Lumes</a>
  </nav>
  <script src="../JS/cabecalho.js"></script>

  <div class="app">
    <header class="page-head container">
      <span class="badge">🎨 Personalização</span>
      <h1>Deixe o jogo com a <span class="grad">sua cara</span></h1>
      <p>Escolha o cenário, o bloco que cai e a explosão de cada acerto. Tudo aqui é estético e não muda o seu desempenho.</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-aba="temas" role="tab" type="button" onclick="somBotao()">🎨 Tema do jogo</button>
      <button class="tab" data-aba="blocos" role="tab" type="button" onclick="somBotao()">🧮 Bloco de cálculo</button>
      <button class="tab" data-aba="explosoes" role="tab" type="button" onclick="somBotao()">💥 Explosão de acerto</button>
    </div>

    <div class="palco-lista container">
      <aside class="lateral">
        <div class="stage cena" id="stage" aria-label="Prévia do visual equipado">
          <div id="stageBloco"></div>
          <div id="stageExp"></div>
        </div>
        <p class="legenda" id="legenda"></p>
      </aside>

      <main class="lista">
        <section class="aba active" id="aba-temas" role="tabpanel"><div class="grid" id="grid-temas"></div></section>
        <section class="aba" id="aba-blocos" role="tabpanel"><div class="grid" id="grid-blocos"></div></section>
        <section class="aba" id="aba-explosoes" role="tabpanel"><div class="grid" id="grid-explosoes"></div></section>
      </main>
    </div>

    <footer class="rodape">
      <div class="container"><a href="loja.html">🛍️ Ir para a Loja</a> • <a href="minigamemat.html">▶ Jogar</a> • <a href="tela-princ.html">Início</a></div>
    </footer>
  </div>

  <!-- Som: fica no painel ⚙️ do cabeçalho (JS/cabecalho.js + JS/sons.js), igual nas outras telas -->

  <div class="toast" id="toast" role="status"></div>

  <script src="../JS/mathlume-dados.js"></script>
  <script>
    (function () {
      var ML = window.MathLume;
      var T = window.MathLumeTemas;
      var $ = function (id) { return document.getElementById(id); };
      var CATS = ['blocos', 'explosoes'];
      var ABAS = ['temas'].concat(CATS);

      /* ---------- abas ---------- */
      function mostrarAba(nome) {
        if (ABAS.indexOf(nome) < 0) nome = 'temas';
        ABAS.forEach(function (c) {
          var ativa = c === nome;
          $('aba-' + c).classList.toggle('active', ativa);
          var t = document.querySelector('[data-aba="' + c + '"]');
          if (t) { t.classList.toggle('active', ativa); t.setAttribute('aria-selected', String(ativa)); }
        });
        document.querySelector('.lista').scrollTop = 0;
      }
      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () { location.hash = t.dataset.aba; });
      });
      window.addEventListener('hashchange', function () { mostrarAba(location.hash.slice(1)); });

      var toastTimer;
      function toast(txt) {
        var t = $('toast');
        t.textContent = txt;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2500);
      }

      /* ---------- emblemas: os mesmos elementos que caem no jogo ---------- */
      var Q = '<b>7 × 8</b>';
      function temaEmb(id) {
        if (id === 'oceano') return '<div class="emb"><div class="bubble"><span class="peixe">🐟</span><small>QUANTO É?</small>' + Q + '</div></div>';
        if (id === 'halloween') return '<div class="emb"><div class="pumpkin"><i class="pk-eye l"></i><i class="pk-eye r"></i>' + Q + '</div></div>';
        if (id === 'floresta') return '<div class="emb"><div class="flame">' + Q + '</div></div>';
        if (id === 'cidade') return '<div class="emb"><div class="slime"><i class="sl-eye l"></i><i class="sl-eye r"></i>' + Q + '</div><div class="slime-gota"></div></div>';
        return '<div class="emb"><div class="rock">' + Q + '</div><div class="rock-tail"></div></div>';
      }
      function blocoEmb(it) {
        if (it.id === 'meteoro') return temaEmb('espaco');
        return '<div class="emb"><div class="bolaw"><span class="ico">' + it.emoji + '</span>' + Q + '</div></div>';
      }

      function p(x, y, s, c, extra) {
        return '<i class="' + (extra || '') + '" style="--x:' + x + 'em;--y:' + y + 'em;--s:' + s + 'em;--c:' + c + ';--r:' + ((x * 37 + y * 23) % 90) + 'deg"></i>';
      }
      function emo(x, y, s, e) { return '<span style="--x:' + x + 'em;--y:' + y + 'em;--s:' + s + 'em">' + e + '</span>'; }
      function explosaoEmb(id) {
        var h = '', i, a, cores;
        if (id === 'ketchup') {
          cores = ['#dc2626', '#b91c1c', '#ef4444', '#991b1b'];
          h += p(0, 0, 3.6, '#dc2626', 'gota');
          for (i = 0; i < 11; i++) { a = i * 6.2832 / 11; h += p((Math.cos(a) * (3.2 + (i % 3) * .9)).toFixed(2), (Math.sin(a) * (2.5 + (i % 3) * .7)).toFixed(2), (.8 + (i % 4) * .35).toFixed(2), cores[i % 4], 'gota'); }
        } else if (id === 'fantasmas') {
          h = emo(-3.6, -1.8, 2.8, '👻') + emo(3.2, -2.4, 2.2, '👻') + emo(-1.2, 2.4, 2.4, '👻') + emo(3.8, 2, 1.8, '👻');
        } else if (id === 'naves') {
          h = emo(-3.6, -.8, 2.4, '🛸') + emo(3.4, -2, 2.8, '🛸') + emo(.2, 2.6, 2.2, '🛸');
        } else if (id === 'moedas') {
          h = emo(-3.8, 1.2, 2.2, '🪙') + emo(-1.8, -2.4, 2.4, '🪙') + emo(.4, .4, 2.8, '🪙') + emo(2.2, -2, 2.2, '🪙') + emo(3.8, 1.6, 2.4, '🪙') + emo(-.4, 3, 2, '🪙');
        } else {
          cores = ['#f472b6', '#facc15', '#38bdf8', '#4ade80', '#a78bfa', '#fb923c'];
          for (i = 0; i < 16; i++) { a = i * 6.2832 / 16; h += p((Math.cos(a) * (3 + (i % 3) * 1.1)).toFixed(2), (Math.sin(a) * (2.3 + (i % 3) * .8)).toFixed(2), (.8 + (i % 2) * .4).toFixed(2), cores[i % 6]); }
        }
        return '<div class="burst">' + h + '</div>';
      }

      /* ---------- informações reais de gameplay de cada tema ---------- */
      var INFO = {
        espaco:    ['Cai: Meteoros', 'Meta: destrua todos os meteoros', 'Céu roxo estrelado'],
        oceano:    ['Cai: Bolhas', 'Responda antes da zona de perigo', 'Algas, corais e peixes'],
        halloween: ['Cai: Abóboras', 'Meta: destrua todas as abóboras', 'Vidas em morcegos 🦇'],
        floresta:  ['Cai: Chamas', 'Meta: extinga todas as chamas', 'Acertar faz chover 🌧️'],
        cidade:    ['Cai: Slimes', 'Meta: bloqueie todos os slimes', 'Acerto solta faíscas ⚡']
      };
      function chips(id) {
        return '<div class="chips">' + (INFO[id] || []).map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</div>';
      }

      /* ---------- cartas ---------- */
      function botao(eq, tem, attr, preco) {
        if (eq) return '<button class="btn" type="button" disabled>✓ Equipado</button>';
        if (tem) return '<button class="btn" type="button" ' + attr + '>Equipar</button>';
        return '<a class="btn ouro" href="loja.html#personalizacao">🔒 Comprar na loja · ' + ML.fmt(preco) + ' Lumes</a>';
      }
      function carta(eq, tem, prevClasse, prevStyle, emblema, titulo, desc, extra, btn) {
        return '<article class="item' + (eq ? ' equipado' : '') + (tem ? '' : ' bloqueado') + '">' +
               '<div class="prev ' + prevClasse + '" style="' + prevStyle + '">' + emblema + (tem ? '' : '<span class="cadeado">🔒</span>') + '</div>' +
               '<div class="corpo"><h3>' + titulo + '</h3><p>' + desc + '</p>' + extra + btn + '</div></article>';
      }

      function card(cat, it) {
        var tem = ML.possui(cat, it.id), eq = ML.estado().equipado[cat] === it.id;
        var emb = cat === 'blocos' ? blocoEmb(it) : explosaoEmb(it.id);
        return carta(eq, tem, '', '', emb, it.nome, it.desc, '',
                     botao(eq, tem, 'data-equipar="' + cat + '" data-id="' + it.id + '"', it.preco));
      }
      function cardTema(t) {
        var tem = T.possui(t.id), eq = T.atual().id === t.id;
        return carta(eq, tem, 'cena cena-' + t.id, 'background:' + t.preview, temaEmb(t.id), 'Tema ' + t.nome, t.desc, chips(t.id),
                     botao(eq, tem, 'data-equipar-tema="' + t.id + '"', t.preco));
      }

      function render() {
        var st = ML.estado();
        $('saldo').textContent = ML.fmt(st.lumes);
        CATS.forEach(function (cat) {
          $('grid-' + cat).innerHTML = ML.catalogo[cat].map(function (it) { return card(cat, it); }).join('');
        });
        $('grid-temas').innerHTML = T.catalogo.map(cardTema).join('');
        var b = ML.equipado('blocos'), x = ML.equipado('explosoes'), tm = T.atual();
        document.body.setAttribute('data-tema', tm.id);
        $('stage').className = 'stage cena cena-' + tm.id;
        $('stage').style.background = tm.preview;
        $('stageBloco').innerHTML = b.id === 'meteoro' ? temaEmb(tm.id) : blocoEmb(b); // no jogo, o bloco padrão assume a forma do tema
        $('stageExp').innerHTML = explosaoEmb(x.id);
        $('legenda').textContent = 'Equipado: Tema ' + tm.nome + ' • ' + b.nome + ' • ' + x.nome;
      }

      document.addEventListener('click', function (e) {
        var tb = e.target.closest('[data-equipar-tema]');
        if (tb) {
          var tm = T.item(tb.dataset.equiparTema);
          if (T.equipar(tm.id)) { render(); toast('✓ Tema ' + tm.nome + ' equipado! Abra o mini-game para ver.'); }
          return;
        }
        var b = e.target.closest('[data-equipar]');
        if (!b) return;
        var it = ML.item(b.dataset.equipar, b.dataset.id);
        if (ML.equipar(b.dataset.equipar, b.dataset.id)) { render(); toast('✓ ' + it.nome + ' equipado!'); }
      });

      window.addEventListener('pageshow', function (e) { if (e.persisted) { ML.recarregar(); render(); } });

      render();
      mostrarAba(location.hash.slice(1));
    })();
  </script>
  <script src="../JS/sons.js"></script>
  <script src="../JS/curvatura.js"></script>
</body>
</html>
