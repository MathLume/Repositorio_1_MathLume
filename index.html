<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlume - Aventura Matemática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="screen-container">

        <div id="start-screen" class="game-area">
            <div class="clouds-container">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
                <div class="cloud cloud-5"></div>
            </div>

            <div class="title-container">
                <h1 class="game-title">MATHLUME</h1>
            </div>

            <div class="decorations">
                <span class="icon icon-cap">🎓</span>
                <span class="icon icon-atom">⚛️</span>
                <span class="icon icon-sigma">Σ</span>
                <span class="icon icon-book">📖</span>
            </div>

            <div class="start-button-wrapper">
                <button id="btn-iniciar" class="start-button">
                    <span class="start-button-text">INICIAR</span>
                </button>
            </div>
        </div>

        <div id="login-screen" class="game-area" style="display: none;">
            <div class="clouds-container">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
            </div>

            <div class="login-card-custom">
                <div class="login-logo-container">
                    <h2 class="login-card-title">MATHLUME</h2>
                </div>

                <div class="login-box">
                    <div class="input-wrapper">
                        <input type="text" placeholder="Usuário" class="login-input-custom">
                    </div>
                    
                    <div class="input-wrapper password-wrapper">
                        <input type="password" placeholder="Senha" class="login-input-custom">
                        <span class="toggle-password">👁️‍🗨️</span>
                    </div>

                    <button id="btn-login-submit" class="btn-confirmar">CONFIRMAR</button>
                    
                    <div class="login-divider">
                        <span>Ou entre com</span>
                    </div>

                    <button class="btn-google">
                        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.2v3.15C3.18 21.35 7.26 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.2C.43 8.13 0 9.99 0 12s.43 3.87 1.2 5.42l4.08-3.15z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.26 0 3.18 2.65 1.2 6.58l4.08 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                        </svg>
                        Google
                    </button>
                </div>
            </div>
        </div>

        <div id="main-screen" class="game-area" style="display: none;">
            <div class="clouds-container">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
            </div>

            <div class="main-top-logo">
                <h1 class="game-title main-title-small">MATHLUME</h1>
            </div>

            <div class="main-nav-bar">
                <button class="nav-btn">INÍCIO</button>
                <button class="nav-btn">PASSE DE BATALHA</button>
                <button class="nav-btn nav-btn-jogar">JOGAR</button>
                <button class="nav-btn">PERSONALIZAR</button>
                <button class="nav-btn">RECORDES</button>
            </div>

            <div class="main-character-area">
                <div class="floating-math-number num-9">9</div>
                <div class="floating-math-number num-2-left">2</div>
                <div class="floating-math-number num-2-right">2</div>
                <div class="floating-math-number num-5">5</div>
                
                <div class="firefly-character">
                    <div class="firefly-glow"></div>
                    <div class="firefly-body">🧙‍♂️✨</div>
                </div>
            </div>

            <div class="bottom-left-controls">
                <button class="gear-btn">⚙️</button>
            </div>
            
            <div class="bottom-right-controls">
                <button id="btn-logout" class="btn-logout-custom">Sair</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
