<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlume - Menu Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen-container">
        <!-- ================= TELA 3.1: MENU PRINCIPAL ================= -->
        <div id="main-screen" class="game-area">
            <div class="clouds-container">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
            </div>

            <div class="main-top-logo">
                <h1 class="game-title main-title-small">MATHLUME</h1>
            </div>

            <div class="main-nav-bar">
                <button class="nav-btn">INÍCIO</button>
                <button class="nav-btn">PASSE DE BATALHA</button>
                <button id="btn-jogar-menu" class="nav-btn nav-btn-jogar">JOGAR</button>
                <button class="nav-btn">PERSONALIZAR</button>
                <button class="nav-btn">RECORDES</button>
            </div>

            <div class="main-character-area">
                <div class="floating-math-number num-9">9</div>
                <div class="floating-math-number num-2-left">2</div>
                <div class="floating-math-number num-2-right">2</div>
                <div class="floating-math-number num-5">5</div>
                
                <div class="firefly-character">
                    <div class="firefly-glow"></div>
                    <div class="firefly-body">✨</div>
                </div>
            </div>

            <div class="bottom-left-controls">
                <button class="gear-btn">⚙️</button>
            </div>
            
            <div class="bottom-right-controls">
                <button id="btn-logout" class="btn-logout-custom">Sair</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
