<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlume - Jogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="screen-container">
        <!-- ================= TELA 3.2: TELA DO JOGO ================= -->
        <div id="game-screen" class="game-area">
            <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

            <div class="absolute top-0 left-0 right-0 z-40 p-6 bg-black/30 backdrop-blur-md border-b-2 border-amber-500/30">
                <div class="flex items-center justify-between max-w-6xl mx-auto">
                    <div class="flex items-center gap-3">
                        <button id="btn-voltar-menu" class="px-3 py-1 bg-purple-800/80 text-white text-sm font-bold rounded-lg border border-amber-400/40 hover:bg-purple-700 mr-2 cursor-pointer">← Menu</button>
                        <span class="text-white font-semibold text-lg">Vidas:</span>
                        <div id="lives-container" class="flex gap-2"></div>
                    </div>
                    <div class="flex items-center gap-8">
                        <div class="text-white font-semibold text-lg">Pontos: <span id="score-display" class="text-amber-400 text-2xl">0</span></div>
                        <div class="text-white font-semibold text-lg">Questões: <span id="questions-display" class="text-purple-400 text-2xl">0/15</span></div>
                    </div>
                </div>
            </div>

            <div id="game-area-content" class="absolute inset-0 pt-24">
                <div id="firefly" class="absolute w-12 h-12 pointer-events-none z-30 transition-transform duration-75">
                    <div class="w-full h-full bg-amber-300 rounded-full shadow-[0_0_25px_#fbbf24,0_0_50px_#fde047]"></div>
                </div>
            </div>

            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-40">
                <form id="answer-form" class="bg-black/70 backdrop-blur-xl p-6 rounded-2xl border-2 border-amber-500/50 shadow-2xl">
                    <div class="flex items-center gap-4">
                        <label class="text-white font-semibold text-lg">Resposta:</label>
                        <input id="answer-input" type="number" placeholder="?" class="px-6 py-3 bg-white/10 text-white text-2xl font-bold rounded-xl border-2 border-amber-400/50 outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-400/30 w-40 text-center" autocomplete="off" />
                        <button type="submit" class="px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold rounded-xl hover:from-green-600 hover:to-emerald-600 transition-all shadow-lg shadow-green-500/50 cursor-pointer">Enviar</button>
                    </div>
                    <p class="text-amber-200 text-sm mt-3 text-center">Pressione Enter para enviar</p>
                </form>
            </div>
        </div>

        <!-- Modais de Vitória / Derrota -->
        <div id="gameover-screen" class="hidden absolute inset-0 flex items-center justify-center z-50 bg-black/70 backdrop-blur-md">
            <div class="text-center space-y-6 p-12 bg-gradient-to-br from-red-900/80 to-purple-900/80 backdrop-blur-xl rounded-3xl border-2 border-red-500/50 shadow-2xl max-w-xl mx-4">
                <i data-lucide="flame" class="w-32 h-32 text-red-500 mx-auto animate-pulse"></i>
                <h2 class="text-6xl font-bold text-white mb-4">Game Over</h2>
                <p class="text-2xl text-red-200">Os escombros chegaram ao limite!</p>
                <div class="bg-black/30 p-6 rounded-xl space-y-2">
                    <p id="final-score-go" class="text-3xl text-amber-400 font-bold">Pontuação Final: 0</p>
                    <p id="final-q-go" class="text-xl text-purple-300">Questões Respondidas: 0/15</p>
                </div>
                <button onclick="startGame()" class="px-10 py-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white text-xl font-bold rounded-full shadow-2xl shadow-purple-500/50 cursor-pointer hover:scale-105 transition-all">Tentar Novamente</button>
            </div>
        </div>

        <div id="victory-screen" class="hidden absolute inset-0 flex items-center justify-center z-50 bg-black/70 backdrop-blur-md">
            <div class="text-center space-y-6 p-12 bg-gradient-to-br from-amber-900/80 to-yellow-900/80 backdrop-blur-xl rounded-3xl border-2 border-amber-500/50 shadow-2xl max-w-xl mx-4">
                <i data-lucide="trophy" class="w-32 h-32 text-amber-400 mx-auto fill-amber-300 animate-bounce"></i>
                <h2 class="text-6xl font-bold text-white mb-4">Vitória!</h2>
                <p class="text-2xl text-amber-200">Parabéns! Você completou todas as 15 questões!</p>
                <div class="bg-black/30 p-6 rounded-xl space-y-2">
                    <p id="final-score-vic" class="text-3xl text-amber-400 font-bold">Pontuação Final: 0</p>
                    <p id="final-lives-vic" class="text-xl text-green-300">Vidas Restantes: 3 ❤️</p>
                </div>
                <button onclick="startGame()" class="px-10 py-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white text-xl font-bold rounded-full shadow-2xl shadow-green-500/50 cursor-pointer block w-full hover:scale-105 transition-all">Jogar Novamente</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
