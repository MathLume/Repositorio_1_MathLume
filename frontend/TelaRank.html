<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking</title>
<!-- Todo o CSS da página fica neste bloco (pode ser movido para um arquivo .css) -->
<style>
  /* Reset: zera margens/paddings e faz width/height incluírem borda e padding */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Base de 16px: todos os valores em rem partem daqui */
  html { font-size: 16px; }
  /* Fundo escuro, texto branco e fonte Inter (com fallbacks do sistema) */
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    background: #080c18;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  /* Botões herdam a fonte da página e mostram cursor de clique */
  button { font-family: inherit; cursor: pointer; }
  /* Evita espaço extra embaixo dos ícones inline */
  svg { display: block; }

  /* ── Telas ─────────────────────────────────────────────── */
  /* Cada 'tela' (ranking / perfil) ocupa a página toda, centralizada, com fundo em degradê */
  .screen {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(160deg, #080c18 0%, #0c1526 50%, #080c18 100%);
  }
  /* Garante que o atributo hidden esconda a tela (display:flex o sobrescreveria) */
  .screen[hidden] { display: none; }
  /* Transição entre telas: entrada (fade) e saída (fade + desliza p/ a esquerda) */
  .screen.enter { animation: screenIn .3s ease both; }
  .screen.leave { animation: screenOut .3s ease both; }
  @keyframes screenIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes screenOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-40px); } }

  /* Container central com largura máxima de 48rem (768px) */
  .wrap { width: 100%; max-width: 48rem; padding-left: 1.5rem; padding-right: 1.5rem; }

  /* ── Header ────────────────────────────────────────────── */
  /* Cabeçalho: temporada, título, filtros de escopo e selo 'Ao vivo' */
  .header { padding-top: 3rem; padding-bottom: 0; }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: .25rem; }
  .season { color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .2em; font-size: .65rem; }
  .title { color: #fff; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.5; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
  .divider { margin-top: 1rem; height: 1px; width: 100%; background: rgba(255,255,255,.06); }

  /* Grupo de botões Regional/Estadual/Global (position:relative para o indicador deslizante) */
  .scope {
    position: relative;
    display: flex; align-items: center; gap: .125rem;
    padding: .25rem; border-radius: .75rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
  }
  /* Fundo roxo que desliza até o botão ativo; left/top/width/height vêm do JS (moveIndicator) */
  .scope-indicator {
    position: absolute; z-index: 0;
    border-radius: .5rem;
    background: rgba(99,102,241,.35);
    transition: left .3s cubic-bezier(.34,1.3,.64,1), width .3s cubic-bezier(.34,1.3,.64,1);
    pointer-events: none;
  }
  /* Botão de escopo (inativo por padrão); z-index acima do indicador */
  .scope button {
    position: relative; z-index: 1;
    padding: .375rem .75rem; border-radius: .5rem;
    font-size: .7rem; font-weight: 500; letter-spacing: .03em;
    color: rgba(255,255,255,.35);
    background: transparent; border: 1px solid transparent;
    transition: all .2s;
  }
  /* Botão ativo: texto branco, negrito e fundo roxo */
  .scope button.active {
    font-weight: 700; color: #fff;
    background: rgba(99,102,241,.5);
    border: 1px solid rgba(99,102,241,.6);
  }
  /* Texto do botão fica acima do indicador */
  .scope button span { position: relative; z-index: 10; }

  /* Selo verde 'Ao vivo' com bolinha pulsante */
  .live {
    display: flex; align-items: center; gap: .375rem;
    padding: .375rem .75rem; border-radius: 9999px;
    background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.2);
  }
  .live .dot { width: .375rem; height: .375rem; border-radius: 9999px; background: #34d399; animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  .live span.txt { color: #34d399; font-size: .72rem; }
  /* Bolinha pisca: opacidade cai para 50% no meio do ciclo */
  @keyframes pulse { 50% { opacity: .5; } }

  /* ── Pódio ─────────────────────────────────────────────── */
  .podium-section { margin-top: 2.5rem; }
  .section-label { color: rgba(255,255,255,.3); text-transform: uppercase; font-size: .62rem; letter-spacing: .18em; }
  .podium-section .section-label { margin-bottom: 1.5rem; }
  /* Pódio: colunas alinhadas pela base; a ordem visual 2º-1º-3º é definida no JS */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: .75rem; }
  /* Cada coluna do pódio; sobe de baixo (fadeUp) com atraso escalonado definido inline */
  .podium-item {
    display: flex; flex-direction: column; align-items: center;
    flex: 1 1 0%; max-width: 160px;
    animation: fadeUp .5s ease-out both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  /* Coroa do 1º lugar balançando */
  .crown { margin-bottom: .25rem; color: #fbbf24; animation: crownRock 2s ease-in-out infinite; }
  @keyframes crownRock { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  /* Wrapper do avatar: cresce 10% no hover (separado do avatar para não conflitar com a animação dele) */
  .avatar-hover { cursor: pointer; transition: transform .2s ease; }
  .avatar-hover:hover { transform: scale(1.1); }
  /* Avatar redondo do pódio; tamanho e brilho (sombra colorida) variam por posição */
  .podium-avatar { border-radius: 9999px; overflow: hidden; border: 2px solid; }
  .podium-avatar.first { width: 5rem; height: 5rem; }
  .podium-avatar.second, .podium-avatar.third { width: 3.5rem; height: 3.5rem; }
  .podium-avatar.r1 { border-color: rgba(251,191,36,.7);  box-shadow: 0 20px 25px -5px rgba(245,158,11,.4),  0 8px 10px -6px rgba(245,158,11,.4); }
  .podium-avatar.r2 { border-color: rgba(203,213,225,.5); box-shadow: 0 20px 25px -5px rgba(148,163,184,.3), 0 8px 10px -6px rgba(148,163,184,.3); }
  .podium-avatar.r3 { border-color: rgba(251,146,60,.5);  box-shadow: 0 20px 25px -5px rgba(249,115,22,.3),  0 8px 10px -6px rgba(249,115,22,.3); }

  /* Nome clicável abaixo do avatar */
  .podium-name { margin-top: .5rem; margin-bottom: .75rem; background: none; border: none; padding: 0; transition: opacity .15s; }
  .podium-name:hover { opacity: .8; }
  .podium-name span { font-size: .78rem; font-weight: 600; }

  /* Degrau do pódio; altura e cor da borda de topo mudam por posição (r1, r2, r3) */
  .podium-block {
    width: 100%; border-top-left-radius: .75rem; border-top-right-radius: .75rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .125rem;
    background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 100%);
    border-top: 2px solid; border-left: 1px solid rgba(255,255,255,.06); border-right: 1px solid rgba(255,255,255,.06);
  }
  .podium-block.r1 { height: 7rem;   border-top-color: #f59e0b; }
  .podium-block.r2 { height: 5rem;   border-top-color: #94a3b8; }
  .podium-block.r3 { height: 3.5rem; border-top-color: #f97316; }
  .podium-block .num { font-weight: 800; line-height: 1.5; }
  .podium-block.r1 .num { font-size: 2rem; }
  .podium-block.r2 .num, .podium-block.r3 .num { font-size: 1.4rem; }
  .podium-block .pts { color: rgba(255,255,255,.4); font-size: .65rem; }

  /* Cores por posição */
  /* c1 = ouro, c2 = prata, c3 = bronze (usadas em texto, números e estrelas) */
  .c1 { color: #fbbf24; } .c2 { color: #cbd5e1; } .c3 { color: #fb923c; }

  /* Animações das imagens (top 3) */
  /* Cada top 3 tem animação própria: 1º flutua, 2º balança, 3º pulsa e gira */
  .a1 { animation: floatY 2.6s ease-in-out infinite; }
  .a2 { animation: wiggle .65s ease-in-out infinite; }
  .a3 { animation: pulseSpin 1.3s ease-in-out infinite; }
  @keyframes floatY    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes wiggle    { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes pulseSpin {
    0%   { transform: scale(1) rotate(0deg); }
    33%  { transform: scale(1.05) rotate(6deg); }
    66%  { transform: scale(1.1) rotate(-6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ── Tabela ────────────────────────────────────────────── */
  .table-section { margin-top: 2.5rem; padding-bottom: 4rem; }
  .table-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .count { color: rgba(255,255,255,.2); font-size: .65rem; }
  /* Moldura arredondada da tabela */
  .table { border-radius: 1rem; overflow: hidden; border: 1px solid rgba(255,255,255,.07); }

  /* Grade de 5 colunas compartilhada por cabeçalho e linhas: # | Jogador | Pontos | Vitórias | Variação */
  .grid { display: grid; grid-template-columns: 3rem 1fr 6rem 5rem 5rem; padding-left: 1.25rem; padding-right: 1.25rem; }
  /* Linha de títulos das colunas */
  .thead { padding-top: .75rem; padding-bottom: .75rem; background: rgba(255,255,255,.03); border-bottom: 1px solid rgba(255,255,255,.06); }
  .thead span { color: rgba(255,255,255,.25); text-transform: uppercase; font-size: .6rem; letter-spacing: .15em; }

  /* Linha de jogador: clicável, com hover e animação de entrada (rowIn) */
  .row {
    position: relative; cursor: pointer; align-items: center;
    padding-top: .8rem; padding-bottom: .8rem;
    border-bottom: 1px solid rgba(255,255,255,.04);
    background: transparent; transition: background .2s;
    animation: rowIn .3s ease-out both;
  }
  .row:hover { background: rgba(255,255,255,.04); }
  /* Linha do usuário logado: fundo roxo em degradê, mantido mesmo no hover */
  .row.me, .row.me:hover { background: linear-gradient(90deg, rgba(99,102,241,.18) 0%, rgba(99,102,241,.06) 100%); }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  /* Barrinha roxa vertical na borda esquerda da linha 'VOCÊ' */
  .me-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-top-right-radius: .25rem; border-bottom-right-radius: .25rem; background: linear-gradient(180deg,#818cf8,#6366f1); }

  /* Coluna da posição: top 3 em cor de destaque, demais em cinza */
  .rank-cell { display: flex; align-items: center; }
  .rank-top { font-size: .85rem; font-weight: 800; }
  .rank-other { color: rgba(255,255,255,.3); font-size: .78rem; font-weight: 600; }

  /* Coluna do jogador: avatar + nome/estrelas */
  .player { display: flex; align-items: center; gap: .75rem; }
  /* Avatar de 36px da tabela; o top 3 tem borda mais grossa (cor definida inline pelo JS) */
  .row-avatar { width: 2.25rem; height: 2.25rem; border-radius: 9999px; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(255,255,255,.1); }
  .row-avatar.top { border-width: 2px; }
  .player-info { display: flex; flex-direction: column; }
  .name-line { display: flex; align-items: center; gap: .375rem; }
  .pname { color: #fff; font-weight: 500; }
  .pname.bold { font-weight: 700; }
  .pname.me { color: #a5b4fc; }
  /* Etiqueta 'VOCÊ' */
  .badge { padding: .125rem .375rem; border-radius: 9999px; background: rgba(99,102,241,.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); font-size: .55rem; font-weight: 700; letter-spacing: .05em; }
  .flame { color: #fbbf24; }
  /* Estrelinhas de nível (1 a 5, calculadas a partir das vitórias) */
  .stars { display: flex; align-items: center; gap: .125rem; margin-top: .125rem; color: rgba(255,255,255,.2); }

  /* Pontos e vitórias; .bold e .me são modificadores */
  .pts-val { color: rgba(255,255,255,.6); font-weight: 500; }
  .pts-val.bold { font-weight: 700; }
  .pts-val.me { color: #a5b4fc; }
  .wins-val { color: rgba(255,255,255,.5); font-weight: 500; }

  /* Variação de posição: verde (subiu), vermelho (caiu), cinza (igual) */
  .trend { display: flex; align-items: center; gap: .125rem; font-size: .72rem; }
  .trend.up { color: #34d399; } .trend.down { color: #fb7185; } .trend.same { color: rgba(255,255,255,.3); }

  /* Imagem preenche o círculo; .avatar-fallback mostra '?' se a imagem falhar */
  .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-fallback { width: 100%; height: 100%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }
  .avatar-fallback span { color: rgba(255,255,255,.3); font-size: .75rem; }

  /* Elemento no fim da lista, observado pelo IntersectionObserver para o carregamento infinito */
  .sentinel { display: flex; align-items: center; justify-content: center; padding: 1.5rem 0; border-top: 1px solid rgba(255,255,255,.04); }
  /* Indicador 'Carregando...': escondido por padrão; o JS adiciona .on */
  .loading { display: none; align-items: center; gap: .5rem; color: rgba(255,255,255,.3); }
  .loading.on { display: flex; }
  .loading span { font-size: .72rem; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Seta ▼ mostrada enquanto não está carregando */
  .arrow { color: rgba(255,255,255,.15); font-size: .65rem; }
  .arrow.off { display: none; }

  /* Rodapé com contador de jogadores e mês */
  .table-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; }
  .table-footer span { color: rgba(255,255,255,.2); font-size: .65rem; }

  /* ── Perfil (substituto simples) ───────────────────────── */
  /* Tela de perfil: conteúdo alinhado ao topo */
  .profile { justify-content: flex-start; }
  .profile .wrap { padding-top: 3rem; }
  .back { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #fff; padding: .5rem 1rem; border-radius: .75rem; font-size: .8rem; }
  .back:hover { background: rgba(255,255,255,.1); }
  .profile-card { margin-top: 2rem; display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .profile-avatar { width: 7rem; height: 7rem; border-radius: 9999px; overflow: hidden; border: 2px solid rgba(255,255,255,.2); }
  .profile-name { font-size: 1.75rem; font-weight: 800; }
  .profile-stats { display: flex; gap: 2rem; margin-top: 1rem; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat b { font-size: 1.4rem; }
  .stat small { color: rgba(255,255,255,.4); text-transform: uppercase; font-size: .6rem; letter-spacing: .15em; }

  /* Celular: colunas e espaçamento menores */
  @media (max-width: 520px) {
    .grid { grid-template-columns: 2.25rem 1fr 4.5rem 3.5rem 3.5rem; padding-left: .75rem; padding-right: .75rem; }
  }
</style>
</head>
<body>

<!-- ═══════════ TELA DE RANKING ═══════════ -->
<!-- Tela principal; os ids abaixo são usados pelo JS para atualizar o conteúdo -->
<div id="ranking-view" class="screen">
  <div class="wrap header">
    <!-- Linha do topo: título à esquerda, filtros e selo à direita -->
    <div class="header-row">
      <div>
        <p class="season">Temporada · Outubro 2026</p>
        <!-- O texto do título muda conforme o escopo escolhido (feito no JS) -->
        <h1 class="title" id="title">Ranking Global</h1>
      </div>
      <div class="header-right">
        <!-- Filtros de escopo; o atributo data-scope é lido pelo JS -->
        <div class="scope" id="scope">
          <!-- Fundo deslizante, posicionado pelo JS -->
          <span class="scope-indicator" id="scope-indicator"></span>
          <button data-scope="regional"><span>Regional</span></button>
          <button data-scope="estadual"><span>Estadual</span></button>
          <button data-scope="global" class="active"><span>Global</span></button>
        </div>
        <!-- Selo 'Ao vivo' (apenas decorativo) -->
        <div class="live"><span class="dot"></span><span class="txt">Ao vivo</span></div>
      </div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="wrap podium-section">
    <p class="section-label">Pódio — Top 3</p>
    <!-- Conteúdo gerado pelo JS (renderPodium) -->
    <div class="podium" id="podium"></div>
  </div>

  <div class="wrap table-section">
    <div class="table-top">
      <p class="section-label">Classificação Geral</p>
      <span class="count" id="count-top">3+ jogadores</span>
    </div>

    <div class="table">
      <div class="grid thead">
        <span>#</span><span>Jogador</span><span>Pontos</span><span>Vitórias</span><span>Variação</span>
      </div>

      <!-- Linhas dos jogadores, inseridas pelo JS -->
      <div id="rows"></div>

      <!-- Sentinela do scroll infinito + indicador de carregamento -->
      <div class="sentinel" id="sentinel">
        <div class="loading" id="loading">
          <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          <span>Carregando mais...</span>
        </div>
        <span class="arrow" id="arrow">▼</span>
      </div>
    </div>

    <div class="table-footer">
      <span id="count-bottom">3+ jogadores · atualizado agora</span>
      <span>Outubro 2026</span>
    </div>
  </div>
</div>

<!-- ═══════════ TELA DE PERFIL ═══════════ -->
<!-- Começa oculta (atributo hidden); aparece ao clicar em um jogador -->
<div id="profile-view" class="screen profile" hidden>
  <div class="wrap">
    <button class="back" id="back">← Voltar</button>
    <div class="profile-card" id="profile-card"></div>
  </div>
</div>

<!-- Toda a lógica (JavaScript puro) fica aqui; substitui React + motion + lucide-react do original -->

// Padrão de variação repetido: 3 sobem, 2 descem, 1 igual
const trends = ["up", "up", "up", "down", "down", "same"];

// Gera uma 'página' de jogadores fictícios, começando na 4ª posição (o top 3 é fixo).
// scope escolhe a lista de nomes; page é o número da página; pageSize, quantos jogadores por página.
function generateUsers(scope, page, pageSize = 15) {
  const pool = namePools[scope];
  return Array.from({ length: pageSize }, (_, i) => {
    // Índice contínuo entre páginas (0 = 4º colocado)
    const globalIdx = page * pageSize + i;
    const nameIdx   = globalIdx % pool.length;
    const rank      = globalIdx + 4;
    // Pontos caem ~30 por posição, com leve variação senoidal para parecer natural; mínimo 100
    const points    = Math.max(100, 3400 - globalIdx * 30 + Math.floor(Math.sin(globalIdx * 7) * 80));
    // Vitórias diminuem com a posição, com variação; mínimo 1
    const wins      = Math.max(1, 8 - Math.floor(globalIdx / 6) + Math.floor(Math.abs(Math.sin(globalIdx * 3)) * 4));
    const trend     = trends[globalIdx % trends.length];
    // Quantas posições subiu/desceu (0 se igual)
    const delta     = trend === "same" ? 0 : 1 + (globalIdx % 5);
    return {
      id: `${scope}-${rank}`,
      name: pool[nameIdx],
      points, wins,
      image: AVATAR_POOL[globalIdx % AVATAR_POOL.length],
      trend, delta,
      isMe: false,
    };
  });
}

// Top 3 fixo; 'isMe: true' marca o usuário atual (Carlos)
const baseTop3 = [
  { id: "1", name: "Yasser",    points: 9850, wins: 42, image: TURTLE_IMG, trend: "up",   delta: 5, isMe: false },
  { id: "2", name: "Alexandre", points: 8420, wins: 36, image: DOG_IMG,    trend: "up",   delta: 2, isMe: false },
  { id: "3", name: "Carlos",    points: 7310, wins: 29, image: NINJA_IMG,  trend: "down", delta: 1, isMe: true  },
];

// ── Ícones (lucide) ──────────────────────────────────────────────────────────
// Ícones SVG inline (copiados do Lucide), no lugar do pacote lucide-react.
// O parâmetro 'extra' preenche o ícone (usado nas estrelas).
const svg = (size, inner, extra = "") =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${extra ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON = {
  crown: (s) => svg(s, '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5.21 20h13.58"/>'),
  up:    (s) => svg(s, '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'),
  down:  (s) => svg(s, '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>'),
  minus: (s) => svg(s, '<path d="M5 12h14"/>'),
  star:  (s) => svg(s, '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>', "fill"),
  flame: (s) => svg(s, '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
};

// ── Helpers ──────────────────────────────────────────────────────────────────
// Escapa caracteres HTML para evitar injeção ao montar HTML com template strings
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// Formata número com separador de milhar conforme o idioma do navegador
const fmt = (n) => n.toLocaleString();

// ImageWithFallback
// Equivalente ao ImageWithFallback do React: se a imagem falhar (onerror), imgFallback troca por um '?'
function imgHTML(src, alt) {
  return `<img class="avatar-img" src="${esc(src)}" alt="${esc(alt)}" onerror="imgFallback(this)">`;
}
function imgFallback(img) {
  const d = document.createElement("div");
  d.className = "avatar-fallback";
  d.innerHTML = "<span>?</span>";
  img.replaceWith(d);
}

// Indicador de variação: seta verde p/ cima, vermelha p/ baixo ou traço cinza
function trendHTML(trend, delta) {
  if (trend === "up")   return `<span class="trend up">${ICON.up(12)}+${delta}</span>`;
  if (trend === "down") return `<span class="trend down">${ICON.down(12)}-${delta}</span>`;
  return `<span class="trend same">${ICON.minus(12)}0</span>`;
}

// ── Estado ───────────────────────────────────────────────────────────────────
// Estado da tela (eram useState no React): escopo atual, linhas extras já carregadas,
// próxima página, flag de carregamento e usuário aberto no perfil
let scope = "global";
let extraRows = [];
let page = 0;
let loading = false;
let activeUser = null;

// Atalho para document.getElementById
const $ = (id) => document.getElementById(id);
const rowsEl = $("rows");

// ── Pódio ────────────────────────────────────────────────────────────────────
// Monta o pódio em ordem visual 2º, 1º, 3º (o 1º fica no centro e mais alto)
function renderPodium() {
  const top3 = baseTop3;
  const order = [top3[1], top3[0], top3[2]];
  // ranks[i] é a posição real da coluna i
  const ranks = [2, 1, 3];
  const sizeCls = { 1: "first", 2: "second", 3: "third" };

  $("podium").innerHTML = order.map((user, idx) => {
    const rank = ranks[idx];
    const isFirst = rank === 1;
    return `
      <div class="podium-item" style="animation-delay:${idx * 0.12}s">
        ${isFirst ? `<div class="crown">${ICON.crown(20)}</div>` : ""}
        <div class="avatar-hover" data-open="${idx}" data-rank="${rank}">
          <div class="podium-avatar r${rank} ${sizeCls[rank]} a${rank}">${imgHTML(user.image, user.name)}</div>
        </div>
        <button class="podium-name" data-open="${idx}" data-rank="${rank}">
          <span class="c${rank}">${esc(user.name)}</span>
        </button>
        <div class="podium-block r${rank}">
          <span class="num c${rank}">${rank}</span>
          <span class="pts">${fmt(user.points)} pts</span>
        </div>
      </div>`;
  }).join("");

  // Clique no avatar ou no nome abre o perfil (data-open guarda o índice no array 'order')
  $("podium").querySelectorAll("[data-open]").forEach((el) => {
    el.addEventListener("click", () => {
      const user = order[Number(el.dataset.open)];
      openProfile(user, Number(el.dataset.rank));
    });
  });
}

// ── Linhas da tabela ─────────────────────────────────────────────────────────
// Cor da borda do avatar na tabela para o top 3 (hex com transparência)
const borderColors = { 1: "#f59e0b80", 2: "#94a3b880", 3: "#f9731680" };

// Cria o elemento de uma linha da tabela; idx é 0-based e rank = idx + 1
function makeRow(user, idx) {
  const rank = idx + 1;
  const isTop3 = rank <= 3;
  const isMe = user.isMe;
  // 1 estrela a cada 10 vitórias (mínimo 1, máximo 5)
  const stars = Math.min(5, Math.max(1, Math.ceil(user.wins / 10)));

  const el = document.createElement("div");
  el.className = "grid row" + (isMe ? " me" : "");
  // Atraso escalonado na animação de entrada, limitado a 0,3s
  el.style.animationDelay = Math.min(0.04 * idx, 0.3) + "s";

  const avatar = isTop3
    ? `<div class="row-avatar top a${rank}" style="border-color:${borderColors[rank]}">${imgHTML(user.image, user.name)}</div>`
    : `<div class="row-avatar">${imgHTML(user.image, user.name)}</div>`;

  // Classes de cor: o top 3 usa c1/c2/c3 e o usuário atual usa roxo
  const starCls = isTop3 ? `c${rank}` : "";
  const ptsCls = "pts-val" + (isTop3 || isMe ? " bold" : "") + (isTop3 ? ` c${rank}` : isMe ? " me" : "");

  // Colunas: posição | jogador (avatar, nome, selo, chama, estrelas) | pontos | vitórias | variação
  el.innerHTML = `
    ${isMe ? '<div class="me-accent"></div>' : ""}
    <div class="rank-cell">
      ${isTop3 ? `<span class="rank-top c${rank}">${rank}</span>` : `<span class="rank-other">${rank}</span>`}
    </div>
    <div class="player">
      ${avatar}
      <div class="player-info">
        <div class="name-line">
          <span class="pname${isMe || isTop3 ? " bold" : ""}${isMe ? " me" : ""}">${esc(user.name)}</span>
          ${isMe ? '<span class="badge">VOCÊ</span>' : ""}
          ${rank === 1 ? `<span class="flame">${ICON.flame(12)}</span>` : ""}
        </div>
        <div class="stars ${starCls}">${Array.from({ length: stars }, () => ICON.star(8)).join("")}</div>
      </div>
    </div>
    <div><span class="${ptsCls}">${fmt(user.points)}</span></div>
    <div><span class="wins-val">${user.wins}</span></div>
    <div>${trendHTML(user.trend, user.delta)}</div>`;

  el.addEventListener("click", () => openProfile(user, rank));
  return el;
}

// Adiciona várias linhas de uma vez com DocumentFragment (um único reflow)
function appendRows(users, startIdx) {
  const frag = document.createDocumentFragment();
  users.forEach((u, i) => frag.appendChild(makeRow(u, startIdx + i)));
  rowsEl.appendChild(frag);
}

// Atualiza os contadores 'N+ jogadores' do topo e do rodapé
function updateCounts() {
  const total = baseTop3.length + extraRows.length;
  $("count-top").textContent = `${total}+ jogadores`;
  $("count-bottom").textContent = `${total}+ jogadores · atualizado agora`;
}

// Volta ao estado inicial (só o top 3); usada ao trocar de escopo
function resetRows() {
  extraRows = [];
  page = 0;
  rowsEl.innerHTML = "";
  appendRows(baseTop3, 0);
  updateCounts();
}

// ── Carregar mais ────────────────────────────────────────────────────────────
// Liga/desliga o 'Carregando...' e esconde a seta ▼
function setLoading(v) {
  loading = v;
  $("loading").classList.toggle("on", v);
  $("arrow").classList.toggle("off", v);
}

// Carrega +15 jogadores após 500 ms (simula uma requisição); ignora se já estiver carregando
function loadMore() {
  if (loading) return;
  setLoading(true);
  // Guarda o escopo atual: se o usuário trocar de aba durante a espera, o resultado antigo é descartado
  const scopeAtStart = scope;
  setTimeout(() => {
    if (scopeAtStart !== scope) { setLoading(false); recheck(); return; }
    const users = generateUsers(scope, page);
    const startIdx = baseTop3.length + extraRows.length;
    extraRows = extraRows.concat(users);
    page += 1;
    appendRows(users, startIdx);
    updateCounts();
    setLoading(false);
    recheck();
  }, 500);
}

// IntersectionObserver (re-observa para disparar de novo se o sentinela ainda estiver visível)
const sentinel = $("sentinel");
// Chama loadMore quando pelo menos 10% do sentinela aparece na tela (scroll infinito)
const observer = new IntersectionObserver(
  (entries) => { if (entries[0].isIntersecting) loadMore(); },
  { threshold: 0.1 }
);
// O observer só avisa quando o estado MUDA. Parar e voltar a observar força uma nova checagem,
// então, se o sentinela ainda estiver visível após carregar, a próxima página é carregada
function recheck() { observer.unobserve(sentinel); observer.observe(sentinel); }
observer.observe(sentinel);

// ── Escopo ───────────────────────────────────────────────────────────────────
const scopeEl = $("scope");
const indicator = $("scope-indicator");

// Posiciona o fundo deslizante exatamente sobre o botão ativo (o CSS anima a transição)
function moveIndicator() {
  const btn = scopeEl.querySelector("button.active");
  if (!btn) return;
  indicator.style.left   = btn.offsetLeft + "px";
  indicator.style.top    = btn.offsetTop + "px";
  indicator.style.width  = btn.offsetWidth + "px";
  indicator.style.height = btn.offsetHeight + "px";
}

// Clique em um escopo: atualiza botão ativo, indicador e título, e reinicia a lista
scopeEl.querySelectorAll("button").forEach((btn) => {
  btn.addEventListener("click", () => {
    const s = btn.dataset.scope;
    if (s === scope) return;
    scope = s;
    scopeEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
    moveIndicator();
    $("title").textContent = "Ranking " + scope.charAt(0).toUpperCase() + scope.slice(1);
    resetRows();
    recheck();
  });
});

// ── Perfil ───────────────────────────────────────────────────────────────────
const rankingView = $("ranking-view");
const profileView = $("profile-view");

// Abre o perfil: preenche o cartão, anima a saída do ranking (300 ms) e então troca as telas
function openProfile(user, rank) {
  activeUser = { ...user, rank };
  $("profile-card").innerHTML = `
    <div class="profile-avatar">${imgHTML(user.image, user.name)}</div>
    <h2 class="profile-name">${esc(user.name)}</h2>
    <div>${trendHTML(user.trend, user.delta)}</div>
    <div class="profile-stats">
      <div class="stat"><b>#${rank}</b><small>Posição</small></div>
      <div class="stat"><b>${fmt(user.points)}</b><small>Pontos</small></div>
      <div class="stat"><b>${user.wins}</b><small>Vitórias</small></div>
    </div>`;
  rankingView.classList.add("leave");
  setTimeout(() => {
    rankingView.classList.remove("leave");
    rankingView.hidden = true;
    profileView.hidden = false;
    profileView.classList.add("enter");
  }, 300);
}

// Botão Voltar: mostra o ranking de novo com animação de entrada
$("back").addEventListener("click", () => {
  activeUser = null;
  profileView.hidden = true;
  profileView.classList.remove("enter");
  rankingView.hidden = false;
  rankingView.classList.add("enter");
  moveIndicator();
  setTimeout(() => rankingView.classList.remove("enter"), 300);
});

// ── Init ─────────────────────────────────────────────────────────────────────
// Inicialização: desenha o pódio e o top 3 da tabela. O indicador é posicionado no primeiro frame,
// e de novo em resize/load (fontes e layout podem mudar as larguras)
renderPodium();
resetRows();
requestAnimationFrame(moveIndicator);
window.addEventListener("resize", moveIndicator);
window.addEventListener("load", moveIndicator);
</script>
